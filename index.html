<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게티와 쇼핑하러 가기!</title>
    <style>
        @font-face {
            font-family: 'KerisKedyuche';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-3@1.0/KERISKEDU_R.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        @font-face {
            font-family: 'KerisKedyuche';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-3@1.0/KERISKEDU_B.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fff;
        }

        .loading_wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .g_img {
            max-height: 500px;
            height: 100%;
            object-fit: cover;
            margin-bottom: 24px;
            animation: walkBounce 0.4s ease-in-out infinite alternate;
        }

        .g_title {
            font-family: 'KerisKedyuche';
            font-size: 1.6rem;
            font-weight: 700;
            color: #333;
            line-height: 1.4;
            word-break: keep-all;
        }

        @keyframes walkBounce {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-12px);
            }
        }

        @media (max-width: 1000px) {
            .g_img {
                max-height: 300px;
            }
            
        .g_title {
            font-family: 'KerisKedyuche';
            font-size: 1.3rem;}
        }
    </style>
</head>

<body>
    <div class="loading_wrap">
        <img src="./gimg.png" alt="쇼핑하는 게티" class="g_img">
        <p class="g_title">게티와 함께 <br> 쇼핑하러 가는 중~!</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const itemCode = urlParams.get('item');

        const linkData = {
            'osmoCam': 'https://link.coupang.com/a/fv3LaAOlOe', // 오즈모 액션캠
            'spray': 'https://link.coupang.com/a/gcs40cgnAq', // 와프와프 스프레이
            'cheepUFO':'https://link.coupang.com/a/gTZI11Im6K', // 가성비ufo
            'cheese': 'https://link.coupang.com/a/gDDfkuUULc', // 아기치즈
              'JJA': 'https://link.coupang.com/a/gNs3YLwyRw', // 짜르르
            'sillbox':'https://link.coupang.com/a/g4cceL4nfg', // 실리콘틀
            'intra':'https://link.coupang.com/a/g37QUbqeiW', //인트라젠플러스
            'cbar':'https://link.coupang.com/a/hJW1QeUDBY', //야크치즈바
            'cof':'https://link.coupang.com/a/h5bWYom3MW', // 바리스타세트
            'safecloth':'https://link.coupang.com/a/iAToGB1z8m', // 방호복투피스 
            'latex':'https://link.coupang.com/a/iAUrKMv6xo', // 코멧라텍스장갑 
            'keybo':'https://link.coupang.com/a/iCTX4Zfs1A', // 키보드경해축   
            
        };
        
const targetUrl = (itemCode && linkData[itemCode]) ? linkData[itemCode] : 'https://blog.naver.com/getti3333';

        // 뒤로가기로 접근했는지 체크하는 이벤트
        window.addEventListener('pageshow', (event) => {
            // event.persisted: 캐시되어 복원된 경우 (뒤로가기 등)
            if (event.persisted) {
                // 뒤로가기 시 로딩에 갇히지 않고 바로 이전(블로그)으로 보냄
                window.history.back();
                return;
            }

            // 처음 들어왔을 때만 1초 뒤 이동
            setTimeout(() => {
                window.location.replace(targetUrl);
            }, 1000);
        });
    </script>
</body>

</html>
